<div class="container_task">
  <div
    class="task"
    *ngFor="let task of taskUpload let i = index"
  >
    <div class="title_task_group">
      <small>
          @if (!task.completed) {
            <span class="status" [appTaskStatus]="task.completed">Pendiente</span>
          } @else {
            <span class="statusTrue" [appTaskStatus]="task.completed">Completa</span>
          }
          &nbsp;
          {{ task.title }}.
        </small>
    </div>
  </div>
</div>
