<h1>Número de tareas: {{numberTasks}}</h1>
<span>Título de tarea: {{titleTask}}</span>

<div class="container-input">
    <!-- [(ngModel)] permite actualizar la variable bindeada en tiempo real, osea mientras se escribe -->
     <!-- Para usar [(ngModel)] se debe importar en el app.module-ts "FormsModule" -->
    <input (input)="sendTask()" type="text" placeholder="Ingresar una tarea" [(ngModel)]="titleTask" />
    <button (click)="sendTask()" [disabled]="activeButton">Ingresar</button>
</div>
